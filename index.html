<!DOCTYPE html>
<html lang="uk">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#2d2445" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>AriSongs</title>
    <meta name="apple-mobile-web-app-title" content="AriSongs" />
    <link rel="manifest" href="./site.webmanifest" />
    <link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png" />
    <link rel="apple-touch-icon" href="./icons/icon-192.png" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="app">
      <main class="scroll-main">
        <div class="cover-wrap">
          <img id="cover" class="cover" alt="" width="512" height="512" />
        </div>

        <section id="playlist-section" class="playlist-block" aria-label="Список треків">
          <div id="playlist" class="list" role="list"></div>
        </section>
      </main>

      <footer class="player-dock" role="region" aria-label="Програвач">
        <div class="dock-times">
          <span id="t-cur">0:00</span>
          <span id="t-end">0:00</span>
        </div>
        <label class="sr-only" for="seek">Позиція треку</label>
        <div class="dock-seek-wrap">
          <input id="seek" class="dock-seek" type="range" min="0" max="1000" value="0" step="1" />
        </div>
        <div class="dock-info">
          <div class="dock-cover-wrap">
          <img id="dock-cover" class="dock-cover" alt="" width="48" height="48" />
          </div>

          <div class="title-line">
            <div class="title-line__text">
              <p id="np-title" class="np-title">—</p>
              <p id="np-artist" class="np-artist">—</p>
            </div>
            <button id="btn-lyrics-now" type="button" class="text-btn" aria-label="Текст пісні">
              <svg class="text-btn__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
                <path d="M8 6h13M8 12h13M8 18h9" />
              </svg>
            </button>
          </div>
        <div class="dock-transport">
          <button id="btn-prev" class="dock-btn" type="button" aria-label="Попередня пісня">
            <svg class="dock-icon" viewBox="0 0 24 24" aria-hidden="true">
              <path fill="currentColor" d="M6 6h2v12H6V6zm3.5 6l8.5 6V4l-8.5 6z" />
            </svg>
          </button>
          <button id="btn-play" class="dock-btn dock-btn--main" type="button" aria-label="Відтворити">
            <svg class="dock-icon dock-icon--lg" viewBox="0 0 24 24" aria-hidden="true">
              <path fill="currentColor" d="M8 5v14l11-7z" />
            </svg>
          </button>
          <button id="btn-next" class="dock-btn" type="button" aria-label="Наступна пісня">
            <svg class="dock-icon" viewBox="0 0 24 24" aria-hidden="true">
              <path fill="currentColor" d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z" />
            </svg>
          </button>
        </div>
        
      </div>
      </footer>
    </div>

    <div id="modal-root" class="modal-backdrop hidden" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <div class="modal">
        <div class="modal__head">
          <div class="modal__titles">
            <h2 id="modal-title" class="modal__title">—</h2>
            <p id="modal-artist" class="modal__sub">—</p>
          </div>
          <button id="modal-close" type="button" class="icon-btn" aria-label="Закрити">
            <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true">
              <path fill="currentColor" d="M6.4 5L5 6.4 10.6 12 5 17.6 6.4 19 12 13.4 17.6 19 19 17.6 13.4 12 19 6.4 17.6 5 12 10.6z" />
            </svg>
          </button>
        </div>
        <div id="modal-lyrics" class="lyrics-body"></div>
      </div>
    </div>

    <audio id="audio" preload="metadata" playsinline></audio>

    <script type="module" src="./app.js"></script>
  </body>
</html>
